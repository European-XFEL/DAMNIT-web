# Import-boundary baseline for the vertical-slice architecture
#
# Current dependency graph, derived with `tach sync`
# `deprecated` marks an edge the vertical-slice rules forbid, with a comment on
# the import causing it. `tach check` prints each use of a deprecated edge

source_roots = ["src"]
exact = true

[[modules]]
path = "damnit_api"
depends_on = ["damnit_api._logging"]

[[modules]]
path = "damnit_api.auth"
depends_on = [
    "damnit_api",
    "damnit_api._db",
    "damnit_api._mymdc",
    # auth imports shared.errors, shared.settings and shared.gql
    { path = "damnit_api.shared", deprecated = true },
    # auth and metadata import each other, auth reads proposal metadata and
    # membership from metadata, which the proposals slice and a proposal
    # directory port should replace
    { path = "damnit_api.metadata", deprecated = true },
]

[[modules]]
path = "damnit_api.contextfile"
depends_on = [
    # contextfile imports metadata
    { path = "damnit_api.metadata", deprecated = true },
]

[[modules]]
path = "damnit_api.metadata"
depends_on = [
    "damnit_api",
    "damnit_api._db",
    "damnit_api._mymdc",
    # metadata imports shared.errors, shared.models, shared.const,
    # shared.settings and shared.gql
    { path = "damnit_api.shared", deprecated = true },
    # metadata/services.py, routers.py and gql.py import
    # auth.dependencies and auth.permissions
    { path = "damnit_api.auth", deprecated = true },
    # metadata/services.py imports runs.sqlite for local mode
    { path = "damnit_api.runs", deprecated = true },
]

[[modules]]
path = "damnit_api.runs"
depends_on = [
    "damnit_api",
    # runs imports shared.const (DamnitType, DEFAULT_PROPOSAL) and
    # shared.settings in runs/sqlite/session.py
    { path = "damnit_api.shared", deprecated = true },
    # runs imports utils (b64image, blob2numpy, create_map,
    # Registry, find_proposal)
    { path = "damnit_api.utils", deprecated = true },
]

[[modules]]
path = "damnit_api.graphql"
depends_on = [
    "damnit_api",
    "damnit_api.shared",
    # graphql/metadata.py imports utils.create_map
    { path = "damnit_api.utils", deprecated = true },
    # graphql/{queries,subscriptions,directives,metadata,utils}.py
    # import runs, auth and metadata internals
    { path = "damnit_api.runs", deprecated = true },
    { path = "damnit_api.auth", deprecated = true },
    { path = "damnit_api.metadata", deprecated = true },
]

[[modules]]
path = "damnit_api.shared"
depends_on = [
    "damnit_api",
    # shared/gql.py assembles the schema from every feature
    { path = "damnit_api.graphql", deprecated = true },
    { path = "damnit_api.metadata", deprecated = true },
    { path = "damnit_api.auth", deprecated = true },
    { path = "damnit_api.runs", deprecated = true },
    "damnit_api._db",
    # shared/settings.py imports _mymdc settings models
    { path = "damnit_api._mymdc", deprecated = true },
]

[[modules]]
path = "damnit_api._db"
depends_on = [
    "damnit_api",
    "damnit_api.shared",
    # _db/bootstrap.py imports metadata.models to register its tables
    { path = "damnit_api.metadata", deprecated = true },
]

[[modules]]
path = "damnit_api._mymdc"
depends_on = ["damnit_api", "damnit_api.shared"]

[[modules]]
path = "damnit_api._logging"
depends_on = ["damnit_api.shared"]

[[modules]]
path = "damnit_api.utils"
depends_on = ["damnit_api.shared"]

# Composition root
[[modules]]
path = "damnit_api.main"
depends_on = [
    "damnit_api._db",
    "damnit_api.shared",
    "damnit_api._mymdc",
    "damnit_api._logging",
    "damnit_api.metadata",
    "damnit_api.contextfile",
    "damnit_api.auth",
]
