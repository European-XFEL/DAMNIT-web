name: damnit-web-test

services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    volumes:
      - ./db:/db
      - ./certs:/certs
      - /gpfs:/gpfs:ro
      - /pnfs:/pnfs:ro
    env_file:
      - .env
    environment:
      - DW_API_DB_PATH=/db/dw_api.sqlite
      - DW_API_UVICORN__HOST=0.0.0.0
      - DW_API_UVICORN__PORT=8443
      - DW_API_UVICORN__SSL_CERTFILE=/certs/cert.bundle
      - DW_API_UVICORN__SSL_KEYFILE=/certs/cert.key
    # Podman's default network (pasta) fails here with "Failed to open()
    # /dev/net/tun: No such device", so the API uses the host's network.
    network_mode: host
    # Unused with network_mode: host; uvicorn binds 8443 on the host itself.
    # ports:
    #   - 8443:8443
    restart: unless-stopped
