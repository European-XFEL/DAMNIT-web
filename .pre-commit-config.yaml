default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
          - id: check-json
            exclude: tsconfig.*\.json$|frontend/apps/demo/public/
          - id: check-merge-conflict
          - id: check-toml
          - id: check-yaml
          # Patch files carry significant whitespace: a blank context line is a
          # single space, and normalising it stops pnpm applying the patch.
          - id: end-of-file-fixer
            stages: [pre-commit]
            # Vendored pack code and reference fixture are pinned by sha256.
            exclude: ^frontend/(apps/demo/public/|patches/)|^api/src/damnit_api/metadata/hzdr_packs/vendor/|^api/tests/fixtures/hzdr-reference/
          - id: trailing-whitespace
            stages: [pre-commit]
            # Vendored pack code and reference fixture are pinned by sha256.
            exclude: ^frontend/(apps/demo/public/|patches/)|^api/src/damnit_api/metadata/hzdr_packs/vendor/|^api/tests/fixtures/hzdr-reference/
          - id: mixed-line-ending
            args: [--fix=lf]
            files: \.(bash|sh)$

    # Recorded HTTP cassettes are scrubbed at record time; this gate catches
    # anything the scrubbing missed before it can be committed. Known-benign
    # matches live in .secrets.baseline (regenerate with:
    # uvx detect-secrets scan api/tests/mock/mymdc/mymdc.yaml \
    #   api/tests/refactor/e2e/cassettes/*/*.yaml > .secrets.baseline).
    - repo: https://github.com/Yelp/detect-secrets
      rev: v1.5.0
      hooks:
          - id: detect-secrets
            name: detect-secrets (recorded cassettes)
            args: ["--baseline", ".secrets.baseline"]
            files: ^api/tests/(mock/mymdc/.*\.ya?ml|refactor/e2e/cassettes/.*\.ya?ml)$

    # ruff walks up from each file to find api/ruff.toml or the root ruff.toml
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.8
      hooks:
          - id: ruff-check
            files: ^(api|scripts)/
          - id: ruff-format
            files: ^(api|scripts)/

    # Local hooks cd into subdirectories and strip the prefix from
    # file arguments so tools see project-relative paths.
    - repo: local
      hooks:
          - id: uv-lock
            name: uv-lock
            entry: uv lock
            language: system
            files: (^|api/)pyproject\.toml$|^uv\.lock$
            pass_filenames: false

          - id: check-characters
            name: check-characters
            entry: uv run python scripts/check-characters/check_characters.py
            language: system
            require_serial: true

          # Upstream (#214) paused pyright; the fork keeps it active but
          # adopts upstream's pre-push staging for type-checks.
          # Keep this hook unfiltered: it checks the full API tree and must run
          # even when a push contains only non-Python changes.
          - id: pyright
            name: pyright
            entry: uv --directory api run --group lint pyright
            language: system
            pass_filenames: false
            stages: [pre-push]

          - id: frontend-eslint
            name: frontend-eslint
            entry: uv run python hzdr/scripts/run_frontend_hook.py eslint
            language: system
            files: ^frontend/
            exclude: ^frontend/apps/demo/public/
            types_or: [javascript, jsx, ts, tsx]

          - id: frontend-prettier
            name: frontend-prettier
            entry: uv run python hzdr/scripts/run_frontend_hook.py prettier
            language: system
            files: ^frontend/
            exclude: ^frontend/apps/demo/public/
            types_or: [javascript, jsx, ts, tsx, json, html, css, markdown]

          - id: frontend-tsc
            name: frontend-tsc
            entry: uv run python hzdr/scripts/run_frontend_hook.py tsc
            language: system
            files: ^frontend/
            types_or: [ts, tsx]
            pass_filenames: false
            stages: [pre-push]
