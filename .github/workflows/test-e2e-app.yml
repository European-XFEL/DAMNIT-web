name: Test e2e app

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "api/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test-e2e-app.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "api/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test-e2e-app.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: "frontend/package.json"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @damnit-frontend/testing exec playwright install --with-deps --only-shell chromium

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      # The API, and DAMNIT itself for the live spec to extract a run with.
      - name: Sync API dependencies
        working-directory: .
        run: uv sync --locked --all-packages --group damnit-backend --no-default-groups

      # No build step: the suite's web server builds the app on every run.
      - name: e2e
        run: pnpm e2e:app

      # always() and ignore for the same reasons as in test-frontend.yml.
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-e2e-app
          path: frontend/apps/app/test-results/e2e/
          if-no-files-found: ignore
