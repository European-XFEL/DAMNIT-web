[project]
name = "DAMNIT-web"
version = "0.3.1"
description = "Monorepo for serving DAMNIT data over the web"
authors = [{ name = "European XFEL", email = "da@xfel.eu" }]
# Declares what LICENSE already states. The HZDR fork retains European XFEL's
# BSD-3-Clause choice and their copyright notice; this is not a relicense.
license = "BSD-3-Clause"
requires-python = "~=3.13.0"
readme = "README.md"
maintainers = [
    { name = "Cammille Carinan", email = "cammille.carinan@xfel.eu" },
    { name = "Robert Rosca", email = "robert.rosca@xfel.eu" },
    { name = "Kristin Tippey", email = "k.tippey@hzdr.de" },
]
dependencies = []

[project.urls]
Repository = "https://github.com/ktippey-hzdr/DAMNIT-web-hzdr"
Issues = "https://github.com/ktippey-hzdr/DAMNIT-web-hzdr/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.11",
    # Coverage for the aggregate HZDR map written by hzdr/scripts/test-all.ps1.
    "pytest-cov>=7.0.0",
    "coverage>=7.0.0",
    # Upstream's look-alike/invisible character check (scripts/check-characters).
    "regex>=2026.9.29",
    "ruff>=0.7",
    # Documentation screenshots (hzdr/scripts/capture-screenshots.py). Folded
    # into `dev` rather than kept as its own group: the split only meant a
    # command that forgot to name it failed as if the tool were broken.
    # `api/`'s groups are upstream's and are deliberately left as they are.
    "playwright>=1.45,<2",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["api"]
